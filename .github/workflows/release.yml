name: Release Cecen Client

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag (optional, e.g. v1.0.0)"
        required: false
      release_name:
        description: "Release name (optional, e.g. Cecen Client v1.0.0)"
        required: false
      body:
        description: "Optional release notes"
        required: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  CLIENT_NAME: CecenClient
  # The source repo is private, so releases go to a public repo the in-game updater can read.
  RELEASE_REPO: revo667/cecen-client-releases

jobs:
  version:
    name: Determine Version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release_info.outputs.tag }}
      title: ${{ steps.release_info.outputs.title }}
      version: ${{ steps.release_info.outputs.version }}
    steps:
    - name: Determine tag and release title
      id: release_info
      run: |
        if [[ "${{ github.event_name }}" == "workflow_dispatch" && -n "${{ github.event.inputs.tag_name }}" ]]; then
          TAG="${{ github.event.inputs.tag_name }}"
          TITLE="${{ github.event.inputs.release_name }}"
          [ -z "$TITLE" ] && TITLE="Cecen Client $TAG"
        elif [[ "${{ github.ref }}" =~ ^refs/tags/ ]]; then
          TAG="${{ github.ref_name }}"
          TITLE="Cecen Client $TAG"
        else
          echo "::error::Give a tag_name (e.g. v1.0.35); run numbers restarted with the new repository."
          exit 1
        fi
        echo "tag=$TAG" >> $GITHUB_OUTPUT
        echo "title=$TITLE" >> $GITHUB_OUTPUT
        echo "version=${TAG#v}" >> $GITHUB_OUTPUT

    # Builds upload straight into this draft instead of going through workflow artifacts,
    # which keeps the release out of the Actions storage quota. It stays hidden until publish.
    - name: Create draft release
      env:
        GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        BODY: ${{ github.event.inputs.body || '' }}
        TAG: ${{ steps.release_info.outputs.tag }}
        TITLE: ${{ steps.release_info.outputs.title }}
      run: |
        if [ -z "$GH_TOKEN" ]; then
          echo "::error::RELEASES_TOKEN secret is missing, it needs contents write access to $RELEASE_REPO"
          exit 1
        fi
        NOTES="${BODY:-Built from revo667/667-client@${GITHUB_SHA::9}}"
        if gh release view "$TAG" -R "$RELEASE_REPO" >/dev/null 2>&1; then
          gh release edit "$TAG" -R "$RELEASE_REPO" --draft --title "$TITLE" --notes "$NOTES"
        else
          gh release create "$TAG" -R "$RELEASE_REPO" --draft --title "$TITLE" --notes "$NOTES"
        fi
  build-cmake:
    name: Build Release (${{ matrix.name }})
    needs: version
    runs-on: ${{ matrix.os }}
    env:
      CARGO_HTTP_MULTIPLEXING: false
      WINDOWS_CERT_BASE64: ${{ secrets.WINDOWS_CERT_BASE64 }}
    strategy:
      fail-fast: false
      matrix:
        include:
        - name: linux
          os: ubuntu-24.04
          cmake-args: -G Ninja -DCMAKE_BUILD_TYPE=Release -DPREFER_BUNDLED_LIBS=ON -DDISCORD_DYNAMIC=ON -DVULKAN=ON
          cmake-init-env: CXXFLAGS="-Werror -Wno-unused-function"
          package-file: "*-linux_x86_64.tar.xz"
          asset-name: CecenClient-linux.tar.xz
        - name: windows
          os: windows-latest
          # Debug info in a .pdb (shipped as a separate symbols asset), so the addresses in beta crash
          # and hang reports can be named. /OPT:REF,ICF keep the release linking /DEBUG turns off.
          # The flags use "-", Git Bash would turn "/O2" into a path.
          cmake-args: -A x64 -DTOOLS=OFF -DDOWNLOAD_GTEST=OFF -DVULKAN=ON "-DCMAKE_C_FLAGS_RELEASE=-O2 -Ob2 -DNDEBUG -Z7" "-DCMAKE_CXX_FLAGS_RELEASE=-O2 -Ob2 -DNDEBUG -Z7" "-DCMAKE_EXE_LINKER_FLAGS_RELEASE=-DEBUG -OPT:REF -OPT:ICF"
          cmake-init-env: CXXFLAGS= LDFLAGS=
          package-file: "*-win64.zip"
          asset-name: CecenClient-windows.zip
        - name: macos
          os: macOS-latest
          cmake-args: -G Ninja -DCMAKE_BUILD_TYPE=Release -DPREFER_BUNDLED_LIBS=ON -DPRECOMPILE_HEADERS=OFF -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0 -DCMAKE_SYSTEM_IGNORE_PATH=/usr/lib -DCMAKE_FIND_FRAMEWORK=LAST
          cmake-init-env: CXXFLAGS=
          package-file: "*-macos.dmg"
          asset-name: CecenClient-macos.dmg

    steps:
    - uses: actions/checkout@v4

    - name: Check out submodules
      shell: bash
      env:
        CECEN_PRIVATE_KEY: ${{ secrets.CECEN_PRIVATE_KEY }}
      run: |
        mkdir -p ~/.ssh
        printf '%s\n' "$CECEN_PRIVATE_KEY" > ~/.ssh/cecen_private
        chmod 600 ~/.ssh/cecen_private
        git -c url."git@github.com:revo667/cecen-private".insteadOf=https://github.com/revo667/cecen-private -c core.sshCommand="ssh -i ~/.ssh/cecen_private -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new" submodule update --init --recursive

    - name: Stamp client version
      shell: bash
      run: |
        VERSION="${{ needs.version.outputs.version }}"
        perl -pi -e "s/^#define SIXCLIENT_VERSION \".*\"/#define SIXCLIENT_VERSION \"$VERSION\"/" src/game/client/components/sixclient/version.h
        grep SIXCLIENT_VERSION src/game/client/components/sixclient/version.h

    - name: Prepare Linux
      if: contains(matrix.os, 'ubuntu')
      run: |
        sudo apt-get update -y
        sudo apt-get install pkg-config ninja-build libcurl4-openssl-dev libdbus-1-dev libfreetype6-dev libnotify-dev libogg-dev libopus-dev libopusfile-dev libsdl2-dev libsqlite3-dev libpng-dev libssl-dev libvulkan-dev libglew-dev -y

    - name: Prepare macOS
      if: contains(matrix.os, 'macOS')
      run: |
        brew update
        brew install pkg-config ninja glew libpng opusfile wavpack x264
        brew upgrade freetype
        pip3 install --break-system-packages dmgbuild pyobjc-framework-Quartz
        echo /Library/Frameworks/Python.framework/Versions/3.12/bin >> "$GITHUB_PATH"
        python3 -c 'import sysconfig; print(sysconfig.get_path("scripts"))' >> "$GITHUB_PATH"
        sudo rm -rf /Library/Developer/CommandLineTools

    - name: Add Rust macOS targets
      if: contains(matrix.os, 'macOS')
      run: |
        rustup default stable
        rustup update
        rustup target add x86_64-apple-darwin aarch64-apple-darwin

    # The macOS build has no Vulkan backend, it renders with OpenGL.
    - name: Install Vulkan SDK
      if: ${{ !contains(matrix.os, 'macOS') }}
      uses: humbletim/install-vulkan-sdk@v1.2
      with:
        version: 1.3.296.0
        cache: true

    - name: Cache Rust dependencies
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: |
          ./

    - name: Build release binaries
      shell: bash
      run: |
        if [[ "${{ matrix.os }}" == windows-latest ]]; then
          cmake -S . -B build-release ${{ matrix.cmake-args }}
        elif [[ "${{ matrix.os }}" == "macOS-latest" ]]; then
          cmake -S . -B build-release ${{ matrix.cmake-args }} -DVULKAN=OFF \
            -DPNG_LIBRARY="${GITHUB_WORKSPACE}/ddnet-libs/png/mac/libfat/libpng16.16.dylib" \
            -DPNG_INCLUDEDIR="${GITHUB_WORKSPACE}/ddnet-libs/png/include"
        else
          cmake -S . -B build-release ${{ matrix.cmake-args }}
        fi
        cmake --build build-release --config Release --target game-client
        if [[ "${{ matrix.os }}" != "macOS-latest" ]]; then
          cmake --build build-release --config Release --target sixclient-updater
        fi

    - name: Sign Windows binaries
      if: contains(matrix.os, 'windows') && env.WINDOWS_CERT_BASE64 != ''
      env:
        WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
      shell: pwsh
      run: |
        if([string]::IsNullOrWhiteSpace($env:WINDOWS_CERT_PASSWORD)) {
          throw "WINDOWS_CERT_PASSWORD secret is required when WINDOWS_CERT_BASE64 is set."
        }
        $CertPath = Join-Path $env:RUNNER_TEMP "codesign.pfx"
        [IO.File]::WriteAllBytes($CertPath, [Convert]::FromBase64String($env:WINDOWS_CERT_BASE64))
        $SignTool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" |
          Sort-Object FullName -Descending | Select-Object -First 1 -ExpandProperty FullName
        if(-not $SignTool) { throw "signtool.exe not found" }
        $CandidateTargets = @("CecenClient.exe", "CecenClient-updater.exe")
        $Targets = $CandidateTargets | ForEach-Object {
          Get-ChildItem -Path build-release -Filter $_ -Recurse -File |
            Select-Object -First 1 -ExpandProperty FullName
        } | Where-Object { $_ } | Select-Object -Unique
        foreach($Target in $Targets) {
          & $SignTool sign /f $CertPath /p $env:WINDOWS_CERT_PASSWORD `
            /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 /v $Target
          if($LASTEXITCODE -ne 0) { throw "signing failed for $Target" }
        }
        Remove-Item $CertPath -Force

    - name: Package release build
      shell: bash
      run: |
        cmake --build build-release --config Release --target package_default
        mkdir -p artifacts
        PKG=$(ls build-release/${{ matrix.package-file }} | head -n 1)
        cp "$PKG" "artifacts/${{ matrix.asset-name }}"
        if [[ "${{ matrix.name }}" == windows ]]; then
          TMP=$(mktemp -d)
          7z x "$PKG" -o"$TMP" > /dev/null
          ROOT=$(ls "$TMP" | head -n 1)
          cp "$TMP/$ROOT/CecenClient.exe" artifacts/CecenClient.exe
          rm -rf "$TMP"
          PDB=$(find build-release -name CecenClient.pdb | head -n 1)
          if [ -n "$PDB" ]; then
            SYMBOLS=$(mktemp -d)
            cp "$PDB" artifacts/CecenClient.exe "$SYMBOLS/"
            7z a artifacts/CecenClient-windows-symbols.zip "$SYMBOLS"/* > /dev/null
            rm -rf "$SYMBOLS"
          fi
        fi
        ls -la artifacts

    - name: Upload release assets
      shell: bash
      env:
        GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        TAG: ${{ needs.version.outputs.tag }}
        TITLE: ${{ needs.version.outputs.title }}
      run: |
        ensure_draft() {
          if gh release view "$TAG" -R "$RELEASE_REPO" >/dev/null 2>&1; then
            return 0
          fi
          NOTES="Built from revo667/667-client@${GITHUB_SHA::9}"
          gh release create "$TAG" -R "$RELEASE_REPO" --draft --title "$TITLE" --notes "$NOTES" || true
          gh release view "$TAG" -R "$RELEASE_REPO" >/dev/null 2>&1
        }
        if ! ensure_draft; then
          echo "::error::Could not create or find draft release $TAG in $RELEASE_REPO"
          exit 1
        fi
        gh release upload "$TAG" artifacts/* -R "$RELEASE_REPO" --clobber

  publish:
    name: Publish Release
    needs:
      - version
      - build-cmake
    runs-on: ubuntu-latest
    steps:
    - name: Publish GitHub Release
      env:
        GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        TAG: ${{ needs.version.outputs.tag }}
      run: |
        ASSETS=$(gh release view "$TAG" -R "$RELEASE_REPO" --json assets --jq '.assets|length')
        echo "assets=$ASSETS"
        gh release view "$TAG" -R "$RELEASE_REPO" --json assets --jq '.assets[].name'
        if [ "${ASSETS:-0}" -lt 1 ]; then
          echo "::error::Refusing to publish empty draft $TAG"
          exit 1
        fi
        gh release edit "$TAG" -R "$RELEASE_REPO" --draft=false --latest

    - name: Announce on Discord
      continue-on-error: true
      env:
        GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        WEBHOOK: ${{ secrets.DISCORD_RELEASE_WEBHOOK }}
        TAG: ${{ needs.version.outputs.tag }}
        TITLE: ${{ needs.version.outputs.title }}
      run: |
        if [ -z "$WEBHOOK" ]; then
          echo "DISCORD_RELEASE_WEBHOOK is not set, skipping"
          exit 0
        fi
        NOTES=$(gh release view "$TAG" -R "$RELEASE_REPO" --json body --jq .body)
        jq -n \
          --arg title "$TITLE" \
          --arg url "https://github.com/$RELEASE_REPO/releases/tag/$TAG" \
          --arg notes "$NOTES" \
          '{
            username: "Cecen Client",
            content: ("**" + $title + "** is out. Restart the game or press Update to get it."),
            embeds: [{
              title: $title,
              url: $url,
              description: ($notes | if length > 4000 then .[0:3997] + "..." else . end),
              color: 8016608
            }]
          }' | curl -fsS -H "Content-Type: application/json" -d @- "$WEBHOOK"

  cleanup-draft:
    name: Cleanup Failed Draft
    if: always() && needs.version.result == 'success' && (needs.build-cmake.result != 'success' || needs.publish.result != 'success')
    needs:
      - version
      - build-cmake
      - publish
    runs-on: ubuntu-latest
    steps:
    - name: Delete empty draft release
      env:
        GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        TAG: ${{ needs.version.outputs.tag }}
      run: |
        if [ -z "$TAG" ]; then
          exit 0
        fi
        META=$(gh release view "$TAG" -R "$RELEASE_REPO" --json isDraft,assets 2>/dev/null || true)
        if [ -z "$META" ]; then
          echo "no release $TAG"
          exit 0
        fi
        DRAFT=$(printf '%s' "$META" | jq -r 'if .isDraft then (.assets|length|tostring) else "published" end')
        if [ "$DRAFT" = "0" ]; then
          gh release delete "$TAG" -R "$RELEASE_REPO" --yes --cleanup-tag || true
          echo "deleted empty draft $TAG"
        else
          echo "keeping $TAG ($DRAFT)"
        fi
