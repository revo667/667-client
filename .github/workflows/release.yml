name: Release 667 Client

on:
  push:
    branches:
      - main
    tags:
      - "v*"
      - "build-*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag (optional, e.g. v1.0.0)"
        required: false
      release_name:
        description: "Release name (optional, e.g. 667 Client v1.0.0)"
        required: false
      body:
        description: "Optional release notes"
        required: false

permissions:
  contents: write

env:
  CLIENT_NAME: 667client

jobs:
  build-cmake:
    name: Build Release (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    env:
      CARGO_HTTP_MULTIPLEXING: false
      WINDOWS_CERT_BASE64: ${{ secrets.WINDOWS_CERT_BASE64 }}
    strategy:
      fail-fast: false
      matrix:
        include:
        - name: linux
          os: ubuntu-24.04
          cmake-args: -G Ninja -DCMAKE_BUILD_TYPE=Release -DPREFER_BUNDLED_LIBS=ON -DDISCORD_DYNAMIC=ON -DVULKAN=ON
          cmake-init-env: CXXFLAGS="-Werror -Wno-unused-function"
          package-file: "*-linux_x86_64.tar.xz"
          artifact-name: release-linux
          asset-name: 667client-linux.tar.xz
        - name: windows
          os: windows-latest
          cmake-args: -A x64 -DTOOLS=OFF -DDOWNLOAD_GTEST=OFF -DVULKAN=ON
          cmake-init-env: CXXFLAGS= LDFLAGS=
          package-file: "*-win64.zip"
          artifact-name: release-windows
          asset-name: 667client-windows.zip
        - name: macos
          os: macOS-latest
          cmake-args: -G Ninja -DCMAKE_BUILD_TYPE=Release -DPREFER_BUNDLED_LIBS=ON -DPRECOMPILE_HEADERS=OFF -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0 -DCMAKE_SYSTEM_IGNORE_PATH=/usr/lib -DCMAKE_FIND_FRAMEWORK=LAST
          cmake-init-env: CXXFLAGS=
          package-file: "*-macos.dmg"
          artifact-name: release-macos
          asset-name: 667client-macos.dmg

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Prepare Linux
      if: contains(matrix.os, 'ubuntu')
      run: |
        sudo apt-get update -y
        sudo apt-get install pkg-config ninja-build libcurl4-openssl-dev libdbus-1-dev libfreetype6-dev libnotify-dev libogg-dev libopus-dev libopusfile-dev libsdl2-dev libsqlite3-dev libpng-dev libvulkan-dev libglew-dev -y

    - name: Prepare macOS
      if: contains(matrix.os, 'macOS')
      run: |
        brew update
        brew install pkg-config ninja molten-vk vulkan-headers glslang spirv-tools glew libpng opusfile wavpack x264
        brew upgrade freetype
        pip3 install --break-system-packages dmgbuild pyobjc-framework-Quartz
        echo /Library/Frameworks/Python.framework/Versions/3.12/bin >> "$GITHUB_PATH"
        python3 -c 'import sysconfig; print(sysconfig.get_path("scripts"))' >> "$GITHUB_PATH"
        sudo rm -rf /Library/Developer/CommandLineTools

    - name: Add Rust macOS targets
      if: contains(matrix.os, 'macOS')
      run: |
        rustup default stable
        rustup update
        rustup target add x86_64-apple-darwin aarch64-apple-darwin

    - name: Install Vulkan SDK
      uses: humbletim/install-vulkan-sdk@v1.2
      with:
        version: 1.3.296.0
        cache: true

    - name: Cache Rust dependencies
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: |
          ./

    - name: Build release binaries
      shell: bash
      run: |
        if [[ "${{ matrix.os }}" == windows-latest ]]; then
          cmake -S . -B build-release ${{ matrix.cmake-args }}
        elif [[ "${{ matrix.os }}" == "macOS-latest" ]]; then
          cmake -S . -B build-release ${{ matrix.cmake-args }} \
            -DPNG_LIBRARY="${GITHUB_WORKSPACE}/ddnet-libs/png/mac/libfat/libpng16.16.dylib" \
            -DPNG_INCLUDEDIR="${GITHUB_WORKSPACE}/ddnet-libs/png/include"
        else
          cmake -S . -B build-release ${{ matrix.cmake-args }}
        fi
        cmake --build build-release --config Release --target game-client
        if [[ "${{ matrix.os }}" != "macOS-latest" ]]; then
          cmake --build build-release --config Release --target sixclient-updater
        fi

    - name: Sign Windows binaries
      if: contains(matrix.os, 'windows') && env.WINDOWS_CERT_BASE64 != ''
      env:
        WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
      shell: pwsh
      run: |
        if([string]::IsNullOrWhiteSpace($env:WINDOWS_CERT_PASSWORD)) {
          throw "WINDOWS_CERT_PASSWORD secret is required when WINDOWS_CERT_BASE64 is set."
        }
        $CertPath = Join-Path $env:RUNNER_TEMP "codesign.pfx"
        [IO.File]::WriteAllBytes($CertPath, [Convert]::FromBase64String($env:WINDOWS_CERT_BASE64))
        $SignTool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" |
          Sort-Object FullName -Descending | Select-Object -First 1 -ExpandProperty FullName
        if(-not $SignTool) { throw "signtool.exe not found" }
        $CandidateTargets = @("667client.exe", "DDNet.exe", "667client-updater.exe")
        $Targets = $CandidateTargets | ForEach-Object {
          Get-ChildItem -Path build-release -Filter $_ -Recurse -File |
            Select-Object -First 1 -ExpandProperty FullName
        } | Where-Object { $_ } | Select-Object -Unique
        foreach($Target in $Targets) {
          & $SignTool sign /f $CertPath /p $env:WINDOWS_CERT_PASSWORD `
            /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 /v $Target
          if($LASTEXITCODE -ne 0) { throw "signing failed for $Target" }
        }
        Remove-Item $CertPath -Force

    - name: Package release build
      shell: bash
      run: |
        cmake --build build-release --config Release --target package_default
        mkdir -p artifacts
        mv build-release/${{ matrix.package-file }} artifacts/${{ matrix.asset-name }}
        if [[ "${{ matrix.os }}" == windows-latest ]]; then
          EXE_FILE=$(find build-release -type f \( -name "667client.exe" -o -name "DDNet.exe" \) | head -n 1)
          if [[ -n "$EXE_FILE" && -f "$EXE_FILE" ]]; then
            cp "$EXE_FILE" artifacts/667client.exe
          fi
        fi

    - name: Upload release package
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.artifact-name }}
        path: artifacts/*

  publish:
    name: Publish Release Assets
    needs:
      - build-cmake
    runs-on: ubuntu-latest
    steps:
    - name: Download release packages
      uses: actions/download-artifact@v4
      with:
        pattern: release-*
        path: artifacts
        merge-multiple: true

    - name: List downloaded release packages
      run: ls -la artifacts

    - name: Determine tag and release title
      id: release_info
      run: |
        if [[ "${{ github.event_name }}" == "workflow_dispatch" && -n "${{ github.event.inputs.tag_name }}" ]]; then
          TAG="${{ github.event.inputs.tag_name }}"
          TITLE="${{ github.event.inputs.release_name }}"
          [ -z "$TITLE" ] && TITLE="667 Client $TAG"
        elif [[ "${{ github.ref }}" =~ ^refs/tags/ ]]; then
          TAG="${{ github.ref_name }}"
          TITLE="667 Client $TAG"
        else
          TAG="v1.0.${{ github.run_number }}"
          TITLE="667 Client $TAG"
        fi
        echo "tag=$TAG" >> $GITHUB_OUTPUT
        echo "title=$TITLE" >> $GITHUB_OUTPUT

    - name: Publish GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.release_info.outputs.tag }}
        name: ${{ steps.release_info.outputs.title }}
        body: ${{ github.event.inputs.body || '' }}
        draft: false
        prerelease: false
        make_latest: true
        generate_release_notes: true
        files: |
          artifacts/${{ env.CLIENT_NAME }}-windows.zip
          artifacts/667client.exe
          artifacts/${{ env.CLIENT_NAME }}-macos.dmg
          artifacts/${{ env.CLIENT_NAME }}-linux.tar.xz
